<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="799" height="379" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="46" font-size="24" fill="#1f2328">Open a pull request</text>
  <text x="24" y="72" font-size="14" fill="#59636e">Create a new pull request by comparing changes across two branches.</text>
  <!-- ramas -->
  <rect x="24.5" y="88.5" width="751" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="34.5" y="96.5" width="120" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="115" font-size="12" fill="#1f2328">base: <tspan font-weight="600">main</tspan></text>
  <text x="166" y="116" font-size="15" fill="#59636e">←</text>
  <rect x="188.5" y="96.5" width="220" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="200" y="115" font-size="12" fill="#1f2328">compare: <tspan font-weight="600">colaborador-patch-1</tspan></text>
  <text x="424" y="115" font-size="13" fill="#1a7f37" font-weight="600">✓ Able to merge.</text>
  <!-- formulario -->
  <text x="24" y="166" font-size="13" font-weight="600" fill="#1f2328">Add a title</text>
  <rect x="24.5" y="176.5" width="560" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="197" font-size="13" fill="#1f2328">Agrego fecha de nacimiento de Mauricio (3.1.5.3)</text>
  <text x="24" y="236" font-size="13" font-weight="600" fill="#1f2328">Add a description</text>
  <rect x="24.5" y="246.5" width="560" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="268" font-size="13" fill="#8c959f">Add your description here...</text>
  <rect x="434.5" y="326.5" width="150" height="32" rx="6" fill="#1f883d" stroke="#1a7f37"/>
  <text x="509" y="347" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Create pull request</text>
  <!-- marca -->
  <rect x="429" y="321" width="161" height="43" rx="9" fill="none" stroke="#cf222e" stroke-width="3"/>
  <circle cx="616" cy="343" r="16" fill="#cf222e"/><text x="616" y="349" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
  <text x="640" y="338" font-size="14" font-weight="700" fill="#cf222e">Tocá "Create</text>
  <text x="640" y="356" font-size="14" font-weight="700" fill="#cf222e">pull request"</text>
</svg>
